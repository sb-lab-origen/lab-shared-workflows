name: build-node (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
    secrets:
      API_KEY:
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: echo "build ok"
